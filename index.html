
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2FA Test</title>
</head>
<body>

<h2>🔐 تجربة Authenticator</h2>

<button onclick="setup()">1️⃣ توليد QR</button>

<br><br>

<img id="qr" width="200" alt="QR Code">

<br><br>

<input type="text" id="code"
       placeholder="ادخل الكود من الموبايل"
       maxlength="6"
       inputmode="numeric">

<button onclick="verify()">2️⃣ تحقق</button>

<p id="result">---</p>

<button onclick="resetAccount()">
  إعادة إنشاء الحساب
</button>

<script src="https://cdn.jsdelivr.net/gh/jiangts/JS-OTP/dist/jsOTP.min.js"></script>

<script>

let secret = localStorage.getItem("auth_secret") || "";

function generateSecret(length = 16) {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
  let result = "";

  const random = new Uint8Array(length);
  crypto.getRandomValues(random);

  for (let i = 0; i < length; i++) {
    result += chars[random[i] % chars.length];
  }

  return result;
}

function setup() {

  if (!secret) {
    secret = generateSecret();
    localStorage.setItem("auth_secret", secret);
  }

  const otpauth =
    `otpauth://totp/MyApp:user@test.com?secret=${secret}&issuer=MyApp`;

  document.getElementById("qr").src =
    "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" +
    encodeURIComponent(otpauth);

  document.getElementById("result").innerText =
    "✔ تم تحميل حسابك السابق أو إنشاء حساب جديد";
}

function verify() {

  try {

    if (!secret) {
      document.getElementById("result").innerText =
        "⚠ يجب إنشاء الحساب أولاً";
      return;
    }

    const code = document.getElementById("code").value.trim();

    if (!/^\d{6}$/.test(code)) {
      document.getElementById("result").innerText =
        "⚠ أدخل رمزاً مكوناً من 6 أرقام";
      return;
    }

    const totp = new jsOTP.totp();

    const current = totp.getOtp(secret);
    const previous = totp.getOtp(secret, Date.now() - 30000);
    const next = totp.getOtp(secret, Date.now() + 30000);

    if (
      code === current ||
      code === previous ||
      code === next
    ) {

      document.getElementById("result").innerText =
        "✅ الكود صحيح";

    } else {

      document.getElementById("result").innerText =
        "❌ الكود خطأ";

    }

  } catch (err) {

    console.error(err);

    document.getElementById("result").innerText =
      "🔥 خطأ بالنظام";

  }
}

function resetAccount() {

  if (confirm("هل تريد إنشاء حساب جديد؟ سيصبح الحساب القديم غير صالح لهذه الصفحة.")) {

    localStorage.removeItem("auth_secret");

    secret = "";

    document.getElementById("qr").src = "";
    document.getElementById("code").value = "";

    document.getElementById("result").innerText =
      "تم حذف المفتاح المحلي. اضغط توليد QR لإنشاء حساب جديد.";

  }

}

window.onload = function() {

  if (secret) {
    setup();
  }

};

</script>

</body>
</html>
